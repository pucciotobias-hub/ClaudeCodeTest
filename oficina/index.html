<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina de agentes</title>
<style>
  :root {
    --panel: rgba(20, 24, 32, .82);
    --texto: #e8ecf2;
    --tenue: #9aa4b2;
    --ok: #3ecf8e;
    --trabajo: #ffb547;
    --error: #ff6b6b;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1530; font-family: system-ui, "Segoe UI", sans-serif; color: var(--texto); }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; width: min(330px, calc(100vw - 32px));
    background: var(--panel); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(6px);
    box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 13px; line-height: 1.4;
  }
  #hud h1 { font-size: 15px; margin: 0 0 2px; display: flex; justify-content: space-between; align-items: baseline; }
  #reloj { font-variant-numeric: tabular-nums; color: var(--tenue); font-weight: 500; }
  #conexion { color: var(--tenue); font-size: 11px; margin-bottom: 10px; }
  .agente { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .punto { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--ok); }
  .punto.trabajando { background: var(--trabajo); box-shadow: 0 0 8px var(--trabajo); animation: latido 1.2s infinite; }
  @keyframes latido { 50% { opacity: .45; } }
  .nombre { font-weight: 600; }
  .que { color: var(--tenue); }
  #corridas { margin-top: 6px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 8px; color: var(--tenue); font-size: 12px; }
  #corridas div { display: flex; justify-content: space-between; }
  .r-ok { color: var(--ok); } .r-error, .r-murio { color: var(--error); } .r-salteado, .r-sin { color: var(--tenue); }
  #botones { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: rgba(255,255,255,.1); color: var(--texto); border: 0; border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.18); }
  button.activo { background: var(--trabajo); color: #1a1200; }
  .globo {
    position: fixed; transform: translate(-50%, -100%); pointer-events: none;
    background: #fff; color: #1b1f27; padding: 5px 10px; border-radius: 12px; font-size: 13px; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.25); transition: opacity .3s; opacity: 0;
  }
  .globo::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .globo.visible { opacity: 1; }
  .etiqueta {
    position: fixed; transform: translate(-50%, 0); pointer-events: none; font-size: 11px; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.45); padding: 1px 7px; border-radius: 8px; white-space: nowrap;
  }
  #ayuda { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: rgba(255,255,255,.55); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <h1>La oficina <span id="reloj">--:--</span></h1>
  <div id="conexion">conectando…</div>
  <div class="agente"><div class="punto" id="p-analista"></div><div><div class="nombre">Analista GGAL</div><div class="que" id="q-analista">—</div></div></div>
  <div class="agente"><div class="punto" id="p-redactor"></div><div><div class="nombre">Redactor semanal</div><div class="que" id="q-redactor">—</div></div></div>
  <div id="corridas"></div>
  <div id="botones">
    <button id="sim-analista">Simular analista</button>
    <button id="sim-redactor">Simular redactor</button>
  </div>
</div>
<div id="ayuda">arrastrá para girar · rueda para zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- escena base
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 12.5, 17);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2, 0.6, -0.3);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 7;
controls.maxDistance = 32;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0xdfefff, 0x5a4a3a, 1.1);
scene.add(hemi);
const sol = new THREE.DirectionalLight(0xfff2dd, 2.2);
sol.position.set(8, 14, 9);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
sol.target.position.set(2, 0, 0);
scene.add(sol, sol.target);
// Luces de noche: una por ambiente, se prenden con el atardecer.
const lucesNoche = [[-1, 0], [4.5, 0], [8.4, -1.5]].map(([x, z]) => {
  const l = new THREE.PointLight(0xffd9a0, 0, 12, 1.6);
  l.position.set(x, 3.0, z);
  scene.add(l);
  return l;
});

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...extra });
function caja(w, h, d, color, x, y, z, padre = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'object' ? color : mat(color));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  padre.add(m);
  return m;
}
function cilindro(rt, rb, h, color, x, y, z, seg = 8, padre = scene) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), typeof color === 'object' ? color : mat(color));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  padre.add(m);
  return m;
}

// ---------------------------------------------------------------- exterior
const pasto = new THREE.Mesh(new THREE.CircleGeometry(40, 32), mat(0x7cc26a));
pasto.rotation.x = -Math.PI / 2;
pasto.position.y = -0.02;
pasto.receiveShadow = true;
scene.add(pasto);
for (let z = 5.2; z < 13; z += 0.9) caja(1.6, 0.04, 0.7, 0xd6d3cd, 1.5, 0.0, z);  // caminito de losetas
function arbol(x, z, s = 1) {
  cilindro(0.15 * s, 0.2 * s, 1 * s, 0x8a5a3b, x, 0.5 * s, z, 6);
  const copa = new THREE.Mesh(new THREE.ConeGeometry(0.9 * s, 1.8 * s, 7), mat(0x4f9d4a));
  copa.position.set(x, 1.8 * s, z);
  copa.castShadow = true;
  scene.add(copa);
}
[[-9, -7, 1.3], [-11, 2, 1], [9, -8, 1.5], [12, 1, 1.1], [-7, 9, 0.9], [8, 10, 1.2], [-14, -3, 1.4]].forEach(a => arbol(...a));

// ---------------------------------------------------------------- la casa
// Corte tipo casa de munecas: paredes del fondo e izquierda altas, derecha baja,
// sin techo ni frente para ver adentro.
// La casa va de x=-6 a x=10: living/oficina a la izquierda y el dormitorio a la
// derecha, detras de un divisor de listones (x=6.6).
const X0 = -6, X1 = 10, FONDO = 9, CX = (X0 + X1) / 2, ANCHO = X1 - X0;
const NEGRO = 0x1f2226, ROBLE = 0xd8b58a;
caja(ANCHO + 0.4, 0.2, FONDO + 0.4, 0xcfcbc4, CX, -0.1, 0);                 // cemento alisado
caja(X1 - 6.6, 0.012, FONDO, ROBLE, (6.6 + X1) / 2, 0.006, 0);              // piso de roble en el dormitorio
for (let x = 6.9; x < X1; x += 0.45) caja(0.01, 0.004, FONDO, 0xc49f74, x, 0.013, 0);
const pared = mat(0xf4f3f0);
caja(ANCHO + 0.4, 3, 0.2, pared, CX, 1.5, -FONDO / 2 - 0.1);                // fondo
caja(0.2, 3, FONDO + 0.4, pared, X0 - 0.1, 1.5, 0);                         // izquierda
caja(0.2, 0.9, FONDO + 0.4, pared, X1 + 0.1, 0.45, 0);                      // derecha (baja, para ver)
caja(ANCHO + 0.4, 0.08, 0.24, NEGRO, CX, 3.04, -FONDO / 2 - 0.1);           // remate negro
caja(0.24, 0.08, FONDO + 0.4, NEGRO, X0 - 0.1, 3.04, 0);
caja(0.24, 0.05, FONDO + 0.4, NEGRO, X1 + 0.1, 0.92, 0);
caja(ANCHO + 0.4, 0.1, 0.02, NEGRO, CX, 0.05, -FONDO / 2 + 0.005);          // zocalo
caja(0.02, 0.1, FONDO + 0.4, NEGRO, X0 + 0.005, 0.05, 0);
// Tira LED arriba de la pared del fondo (se prende de noche).
const led = new THREE.MeshStandardMaterial({ color: 0xffe2b0, emissive: 0xffc877, emissiveIntensity: 0 });
caja(ANCHO, 0.03, 0.05, led, CX, 2.9, -FONDO / 2 + 0.03);
caja(3.4, 0.015, 2.6, 0xe7e1d6, 0.3, 0.02, 1.4);                            // alfombra
caja(3.0, 0.016, 2.2, 0xd8cfc0, 0.3, 0.021, 1.4);

// Ventanales de piso a techo con perfileria negra: el vidrio sigue el color del cielo.
const vidrio = new THREE.MeshStandardMaterial({ color: 0x9fd3f5, emissive: 0x9fd3f5, emissiveIntensity: 0.4, flatShading: true, roughness: 0.2 });
function ventanal(x, z, rotY, ancho = 2.0, alto = 2.6, y0 = 0.15) {
  const g = new THREE.Group();
  g.position.set(x, y0 + alto / 2, z);
  g.rotation.y = rotY;
  scene.add(g);
  caja(ancho, alto, 0.05, vidrio, 0, 0, 0, g);
  const hojas = Math.max(2, Math.round(ancho / 1.0));
  for (let i = 0; i <= hojas; i++) caja(0.05, alto + 0.05, 0.08, NEGRO, -ancho / 2 + i * ancho / hojas, 0, 0.03, g);
  caja(ancho + 0.05, 0.05, 0.08, NEGRO, 0, alto / 2, 0.03, g);
  caja(ancho + 0.05, 0.05, 0.08, NEGRO, 0, -alto / 2, 0.03, g);
}
ventanal(-1.1, -FONDO / 2 + 0.02, 0, 2.0);
ventanal(X0 + 0.02, -0.2, Math.PI / 2, 2.6);
ventanal(8.3, -FONDO / 2 + 0.02, 0, 3.0, 0.8, 1.9);                         // banderola sobre las camas

// Divisor de listones de roble entre el living y el dormitorio (deja paso adelante).
for (let z = -4.45; z < -0.6; z += 0.16) caja(0.05, 2.9, 0.07, ROBLE, 6.6, 1.45, z);
caja(0.08, 0.05, 3.9, NEGRO, 6.6, 2.92, -2.55);

// Colgantes: pantalla negra con foco que se prende de noche o cuando trabajan.
function colgante(x, z, largo = 1.0) {
  cilindro(0.008, 0.008, largo, NEGRO, x, 3.0 - largo / 2, z, 4);
  const p = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.22, 16, 1, true), mat(NEGRO, { side: THREE.DoubleSide }));
  p.position.set(x, 3.0 - largo - 0.08, z);
  scene.add(p);
  const foco = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), new THREE.MeshStandardMaterial({ color: 0xfff2c0, emissive: 0xffd36b, emissiveIntensity: 0 }));
  foco.position.set(x, 3.0 - largo - 0.16, z);
  scene.add(foco);
  return foco;
}
const focosColgantes = [colgante(5.4, -1.8, 0.9), colgante(5.4, -0.8, 0.9), colgante(0.3, 1.4, 0.7)];

// ---------------------------------------------------------------- pantallas
function pantalla(ancho = 256, alto = 160) {
  const cv = document.createElement('canvas');
  cv.width = ancho; cv.height = alto;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return { cv, ctx: cv.getContext('2d'), tex };
}

function escritorio(x, colorSilla) {
  const z = -3.75;
  caja(1.9, 0.05, 1.0, 0xf5f5f3, x, 0.78, z);
  for (const dx of [-0.9, 0.9]) {                                  // patas en marco negro
    caja(0.04, 0.76, 0.04, NEGRO, x + dx, 0.38, z - 0.42);
    caja(0.04, 0.76, 0.04, NEGRO, x + dx, 0.38, z + 0.42);
    caja(0.04, 0.04, 0.88, NEGRO, x + dx, 0.02, z);
  }
  // monitor
  const p = pantalla();
  caja(0.1, 0.35, 0.1, 0x333a44, x, 1.0, z - 0.15);
  caja(1.1, 0.7, 0.06, 0x2a2f38, x, 1.45, z - 0.18);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.6), new THREE.MeshBasicMaterial({ map: p.tex }));
  scr.position.set(x, 1.45, z - 0.145);
  scene.add(scr);
  caja(0.6, 0.03, 0.2, 0x444b55, x, 0.835, z + 0.38);           // teclado
  const taza = cilindro(0.06, 0.05, 0.12, 0xffffff, x + 0.65, 0.88, z + 0.1, 8);
  // lampara de escritorio
  cilindro(0.1, 0.12, 0.03, 0x2d2d2d, x - 0.75, 0.835, z - 0.2);
  cilindro(0.015, 0.015, 0.45, 0x2d2d2d, x - 0.75, 1.05, z - 0.2);
  const pantallita = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.18, 8, 1, true), mat(0x2d2d2d, { side: THREE.DoubleSide }));
  pantallita.position.set(x - 0.68, 1.28, z - 0.2);
  pantallita.rotation.z = 0.6;
  scene.add(pantallita);
  const foco = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshStandardMaterial({ color: 0xfff2c0, emissive: 0xffd36b, emissiveIntensity: 0 }));
  foco.position.set(x - 0.66, 1.23, z - 0.2);
  scene.add(foco);
  const luz = new THREE.PointLight(0xffd36b, 0, 3.5, 1.8);
  luz.position.set(x - 0.5, 1.2, z + 0.1);
  scene.add(luz);
  // silla
  const zs = -2.85;
  caja(0.6, 0.08, 0.6, colorSilla, x, 0.52, zs);
  caja(0.6, 0.65, 0.08, colorSilla, x, 0.85, zs + 0.28);
  cilindro(0.04, 0.04, 0.45, 0x333333, x, 0.26, zs);
  caja(0.55, 0.04, 0.08, 0x333333, x, 0.03, zs);
  caja(0.08, 0.04, 0.55, 0x333333, x, 0.03, zs);
  return { p, foco, luz, taza, silla: { x, z: zs } };
}
const escA = escritorio(-3.4, 0x3d6fb6);
const escR = escritorio(1.3, 0xc0504d);

// Poster sobre el escritorio del analista y corcho del redactor.
function cartel(x, y, dibujar, ancho = 1.1, alto = 0.75) {
  const p = pantalla(256, 176);
  dibujar(p.ctx, 256, 176);
  p.tex.needsUpdate = true;
  caja(ancho + 0.06, alto + 0.06, 0.03, NEGRO, x, y, -FONDO / 2 + 0.02);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ancho, alto), new THREE.MeshBasicMaterial({ map: p.tex }));
  m.position.set(x, y, -FONDO / 2 + 0.05);
  scene.add(m);
}
cartel(-3.4, 2.4, (c, w, h) => {
  c.fillStyle = '#131722'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#e8ecf2'; c.font = 'bold 26px system-ui'; c.fillText('GGAL', 14, 34);
  c.fillStyle = '#9aa4b2'; c.font = '14px system-ui'; c.fillText('BUY THE DIP (?)', 14, 56);
  let y = 70;
  for (let i = 0; i < 11; i++) {
    const baja = i % 4 !== 2, x = 20 + i * 21, largo = 10 + (i * 7) % 14;
    c.fillStyle = baja ? '#f23645' : '#089981';
    c.fillRect(x, y, 12, largo);
    c.fillRect(x + 5, y - 5, 2, largo + 10);
    y += baja ? 8 : -5;
  }
});
cartel(1.3, 2.4, (c, w, h) => {
  c.fillStyle = '#c89b63'; c.fillRect(0, 0, w, h);
  const notas = [['#fff59d', 'PCE mié'], ['#ffccbc', 'NFP vie'], ['#c8e6c9', 'riesgo país'], ['#b3e5fc', 'licitación']];
  notas.forEach(([col, txt], i) => {
    const x = 16 + (i % 2) * 120, y = 16 + Math.floor(i / 2) * 78;
    c.fillStyle = col; c.fillRect(x, y, 104, 64);
    c.fillStyle = '#e53935'; c.beginPath(); c.arc(x + 52, y + 6, 5, 0, 7); c.fill();
    c.fillStyle = '#333'; c.font = '16px system-ui'; c.fillText(txt, x + 10, y + 40);
  });
});

// Pizarra
const pizarra = pantalla(320, 200);
(() => {
  const c = pizarra.ctx;
  c.fillStyle = '#f8f8f5'; c.fillRect(0, 0, 320, 200);
  c.strokeStyle = '#2b62c4'; c.lineWidth = 3; c.beginPath();
  [[20, 40], [70, 60], [110, 50], [150, 95], [190, 85], [240, 140], [290, 150]].forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
  c.stroke();
  c.strokeStyle = '#d33'; c.setLineDash([8, 6]); c.beginPath(); c.moveTo(10, 160); c.lineTo(310, 160); c.stroke();
  c.setLineDash([]); c.fillStyle = '#d33'; c.font = 'bold 18px system-ui'; c.fillText('S2 36.56', 200, 185);
  c.fillStyle = '#333'; c.font = '18px system-ui'; c.fillText('¿rebote o gap?', 20, 185);
})();
pizarra.tex.needsUpdate = true;
caja(2.2, 1.4, 0.04, NEGRO, 4.1, 1.85, -FONDO / 2 + 0.03);
{
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.05, 1.28), new THREE.MeshBasicMaterial({ map: pizarra.tex }));
  m.position.set(4.1, 1.85, -FONDO / 2 + 0.07);
  scene.add(m);
}

// Sofa bajo gris con patitas negras + mesa ratona redonda
const sofaColor = 0x8c9097, almohadon = 0xa3a7ad;
caja(0.95, 0.3, 2.8, sofaColor, -5.45, 0.27, 2.0);
caja(0.22, 0.72, 2.8, sofaColor, -5.83, 0.5, 2.0);
caja(0.95, 0.46, 0.18, sofaColor, -5.45, 0.35, 0.69);
caja(0.95, 0.46, 0.18, sofaColor, -5.45, 0.35, 3.31);
caja(0.72, 0.16, 1.2, almohadon, -5.37, 0.5, 1.4);
caja(0.72, 0.16, 1.2, almohadon, -5.37, 0.5, 2.6);
for (const dz of [0.7, 3.3]) for (const dx of [-0.4, 0.4]) caja(0.05, 0.12, 0.05, NEGRO, -5.45 + dx, 0.06, dz);
caja(0.1, 0.35, 0.35, 0xe07b39, -5.62, 0.75, 3.0);  // almohadon de color
cilindro(0.55, 0.55, 0.05, 0xf5f5f3, -3.7, 0.42, 2.0, 24);
cilindro(0.05, 0.05, 0.4, NEGRO, -3.7, 0.2, 2.0, 8);
cilindro(0.3, 0.3, 0.02, NEGRO, -3.7, 0.01, 2.0, 16);
caja(0.35, 0.03, 0.25, 0xf5f0e0, -3.6, 0.46, 1.85);  // diario

// Isla de cocina con cafetera y banquetas
caja(0.9, 0.9, 2.3, 0xf5f5f3, 5.4, 0.45, -1.3);
caja(0.98, 0.05, 2.4, 0x2b2e33, 5.4, 0.925, -1.3);
caja(0.42, 0.52, 0.38, 0x2e2e2e, 5.5, 1.21, -1.6);
caja(0.28, 0.08, 0.28, 0x555555, 5.35, 0.99, -1.6);
const lucesitaCafe = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 4), new THREE.MeshStandardMaterial({ color: 0x33ff66, emissive: 0x33ff66, emissiveIntensity: 1 }));
lucesitaCafe.position.set(5.28, 1.38, -1.5);
scene.add(lucesitaCafe);
for (let i = 0; i < 3; i++) cilindro(0.06, 0.05, 0.12, [0xffffff, 0xf7c948, 0x4fa3e0][i], 5.4, 1.01, -0.9 + i * 0.16, 8);
for (const z of [-1.9, -0.7]) {
  cilindro(0.2, 0.2, 0.06, ROBLE, 6.2, 0.72, z, 16);
  cilindro(0.025, 0.025, 0.7, NEGRO, 6.2, 0.36, z, 6);
  cilindro(0.18, 0.18, 0.02, NEGRO, 6.2, 0.01, z, 12);
}

// Biblioteca de metal negro con estantes de roble
for (const dz of [-0.78, 0.78]) caja(0.4, 2.2, 0.04, NEGRO, -5.75, 1.1, -2.6 + dz);
const coloresLibros = [0xc0504d, 0x3d6fb6, 0xf7c948, 0x6c8f5e, 0x8e6bbf, 0xe07b39];
for (let e = 0; e < 4; e++) {
  caja(0.4, 0.04, 1.56, ROBLE, -5.75, 0.2 + e * 0.55, -2.6);
  for (let i = 0; i < 6; i++) {
    const h = 0.3 + ((i * 13 + e * 7) % 10) / 70;

class Agente {
  constructor(id, modelo, silla, pantallaEsc, inicio) {
    Object.assign(this, { id, m: modelo, silla, esc: pantallaEsc });
    this.pos = new THREE.Vector2(...inicio);
    this.ang = 0;
    this.angObj = 0;
    this.cola = [];
    this.accion = null;
    this.pose = 'parado';
    this.modo = null;
    this.t = 0;
    this.trabajando = false;
    this.turno = null;
    this.paso = null;
    this.actividad = 'llegando';
    this.otro = null;
    this.ocupadoCharla = false;
    scene.add(modelo.raiz);
    this.globo = Object.assign(document.createElement('div'), { className: 'globo' });
    this.etiqueta = Object.assign(document.createElement('div'), { className: 'etiqueta', textContent: id === 'analista' ? 'Analista' : 'Redactor' });
    document.body.append(this.globo, this.etiqueta);
    this.globoHasta = 0;
    this.proxMensaje = 0;
  }

  decir(txt, seg = 4) {
    this.globo.textContent = txt;
    this.globo.classList.add('visible');
    this.globoHasta = reloj.elapsedTime + seg;
  }

  ruta(x, z) {
    // Por el pasillo del medio para no atravesar muebles.
    const pasos = [];
    let cx = this.pos.x, cz = this.pos.y;
    // Si esta sentado en el sofa, primero sale por delante (si no, atraviesa el apoyabrazos).
    if (this.lugarActual && this.lugarActual.acceso) {
      [cx, cz] = this.lugarActual.acceso;
      pasos.push({ tipo: 'ir', x: cx, z: cz });
    }
    this.lugarActual = null;
    if (Math.abs(cz - PASILLO_Z) > 0.3 && Math.abs(cx - x) > 0.3) pasos.push({ tipo: 'ir', x: cx, z: PASILLO_Z });
    if (Math.abs(z - PASILLO_Z) > 0.3 && Math.abs(this.pos.x - x) > 0.3) pasos.push({ tipo: 'ir', x, z: PASILLO_Z });
    pasos.push({ tipo: 'ir', x, z });
    return pasos;
  }
  rutaA(l) {
    return l.acceso ? [...this.ruta(...l.acceso), { tipo: 'ir', x: l.x, z: l.z }] : this.ruta(l.x, l.z);
  }

  // El estado real manda: si cambia, se tira el plan y se arma uno nuevo.
  setTrabajo(trabajando, turno, paso, resultado) {
    if (trabajando !== this.trabajando) {
      const antes = this.trabajando;
      this.trabajando = trabajando;
      this.cola = [];
      this.accion = null;
      this.ocupadoCharla = false;
      if (!trabajando && antes) {
        this.cola.push({ tipo: 'decir', txt: resultado === 'ok' ? '¡Listo! Informe commiteado ✅' : resultado ? 'Uff, algo falló 😩' : 'Terminé 🙌', seg: 5 });
        this.cola.push({ tipo: 'quieto', dur: 1.5, modo: resultado === 'ok' ? 'festejo' : null, sentado: true });
      }
    }
    this.turno = turno;
    this.paso = paso;
  }

  planificar() {
    if (this.trabajando) {
      this.actividad = 'trabajando';
      this.cola.push(...this.rutaA(this.silla), { tipo: 'sentar', lugar: this.silla, modo: 'tipear', dur: Infinity });
      return;
    }
    const opciones = [
      ['cafe', 3], ['sofa', 2], ['cama', 2], ['ventana', 2], ['pasear', 2], ['charla', 2], ['planta', 1], ['pizarra', 1], ['biblioteca', 1], ['diario', 1],
    ];
    let total = opciones.reduce((a, o) => a + o[1], 0), r = Math.random() * total, elegida = 'pasear';
    for (const [n, w] of opciones) { if ((r -= w) < 0) { elegida = n; break; } }
    // De noche (23:30 a 7) se van a dormir a su cama y no salen hasta la manana.

    if (elegida === 'charla' && !(otro && !otro.trabajando && !otro.ocupadoCharla && otro.pose !== 'acostado' && !otro.actividad.startsWith('durmiendo'))) elegida = 'cafe';
    this.actividad = {
      cafe: 'tomando un café', sofa: 'descansando en el sofá', cama: deNoche ? 'durmiendo (buenas noches)' : 'durmiendo la siesta en su cama', ventana: 'mirando por la ventana', pasear: 'dando vueltas',
      charla: 'charlando', planta: 'regando la planta', pizarra: 'mirando la pizarra', biblioteca: 'buscando un libro', diario: 'leyendo el diario',

          { tipo: 'acostar', lugar: this.cama, dur: deNoche ? entre(120, 240) : entre(15, 30) }, { tipo: 'decir', txt: deNoche ? 'Mmm… ¿ya es de día?' : '¡Como nuevo!' });

        break;

        break;
      case 'planta':
        this.cola.push(...this.rutaA(L.planta), { tipo: 'girar', ang: L.planta.ang }, { tipo: 'decir', txt: '🌱 Agüita' }, { tipo: 'quieto', dur: 5, modo: 'regar' });
        break;
      case 'charla': {
        const [a, b] = azar(CHARLA);
        const punto = new THREE.Vector2(entre(-1.5, 2.5), entre(1.2, 2.6));
        this.ocupadoCharla = otro.ocupadoCharla = true;
        otro.cola = [];
        otro.accion = null;
        otro.actividad = this.actividad = 'charlando';
        this.cola.push(...this.ruta(punto.x - 0.6, punto.y), { tipo: 'mirarA', a: otro }, { tipo: 'decir', txt: a, seg: 4 }, { tipo: 'quieto', dur: 4.5, modo: 'gesto' }, { tipo: 'quieto', dur: 4.5 },
          { tipo: 'decir', txt: azar(['Jaja', 'Tal cual', 'Veremos…']), seg: 3 }, { tipo: 'quieto', dur: 3, modo: 'gesto' }, { tipo: 'fin-charla' });
        otro.cola.push(...otro.ruta(punto.x + 0.6, punto.y), { tipo: 'mirarA', a: this }, { tipo: 'quieto', dur: 4.5 }, { tipo: 'decir', txt: b, seg: 4 }, { tipo: 'quieto', dur: 4.5, modo: 'gesto' },
          { tipo: 'quieto', dur: 3 }, { tipo: 'fin-charla' });
        break;
      }
      default:
        for (let i = 0; i < 3; i++) this.cola.push(...this.ruta(entre(-3, 4), entre(0.6, 3.6)));
        this.cola.push({ tipo: 'quieto', dur: entre(2, 4), modo: 'estirar' });
    }
    this.cola.push({ tipo: 'quieto', dur: entre(1, 3) });
  }

  update(dt, t) {
    if (!this.accion) {
      if (!this.cola.length) this.planificar();
      this.accion = this.cola.shift();
      this.t = 0;
    }
    const a = this.accion;
    this.t += dt;
    let terminada = false;
    switch (a.tipo) {
      case 'ir': {
        const obj = new THREE.Vector2(a.x, a.z), d = obj.clone().sub(this.pos), dist = d.length();
        if (dist < 0.05) { terminada = true; break; }
        this.pose = 'caminar';
        this.angObj = Math.atan2(d.x, d.y);
        this.pos.add(d.normalize().multiplyScalar(Math.min(dist, 1.7 * dt)));
        break;
      }
      case 'girar': this.angObj = a.ang; terminada = true; break;
      case 'mirarA': { const d = a.a.pos.clone().sub(this.pos); this.angObj = Math.atan2(d.x, d.y); terminada = true; break; }
      case 'decir': this.decir(a.txt, a.seg); terminada = true; break;
      case 'taza': this.m.taza.visible = a.on; terminada = true; break;
      case 'fin-charla': this.ocupadoCharla = false; terminada = true; break;
      case 'sentar':
        this.pose = 'sentado';
        this.modo = a.modo;
        this.lugarActual = a.lugar;
        this.pos.set(a.lugar.x, a.lugar.z);
        this.angObj = a.lugar.ang;
        this.alturaAsiento = a.lugar.y;
        terminada = this.t > a.dur;
        break;
      case 'acostar':
        this.pose = 'acostado';
        this.modo = 'dormir';
        this.lugarActual = a.lugar;
        this.pos.set(a.lugar.x, a.lugar.z);
        this.angObj = a.lugar.ang;
        terminada = this.t > a.dur;
        break;
      case 'quieto':
        if (!a.sentado) this.pose = 'parado';
        this.modo = a.modo || null;
        terminada = this.t > a.dur;
        break;
    }
    if (terminada) { this.accion = null; if (a.tipo === 'sentar' || a.tipo === 'quieto' || a.tipo === 'acostar') this.modo = null; }
    this.animar(dt, t);
    this.mensajesTrabajo(t);
  }

  mensajesTrabajo(t) {
    if (!this.trabajando || this.pose !== 'sentado' || t < this.proxMensaje) return;
    const lista = MENSAJES[this.paso === 'chrome' || this.paso === 'preparando' ? this.paso : this.turno] || MENSAJES.apertura;
    this.decir(azar(lista), 4.5);
    this.proxMensaje = t + entre(6, 9);
  }

  animar(dt, t) {
    const m = this.m;
    // giro suave
    let da = this.angObj - this.ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    this.ang += da * Math.min(1, dt * 8);
    const acostado = this.pose === 'acostado';
    m.raiz.position.set(this.pos.x, acostado ? this.cama.y : 0, this.pos.y);
    m.raiz.rotation.y = this.ang;
    // Acostado boca arriba: el cuerpo gira sobre los pies y la cabeza cae en la almohada.
    m.cuerpo.rotation.x += ((acostado ? -Math.PI / 2 : 0) - m.cuerpo.rotation.x) * Math.min(1, dt * 12);
    this.cama.manta.visible = acostado;

    const s = Math.sin(t * 9);
    const reset = { pI: 0, pD: 0, bI: 0, bD: 0, bIz: 0, bDz: 0, y: 0, cabX: 0, cabZ: 0 };
    const o = { ...reset };
    if (this.pose === 'caminar') {
      o.pI = s * 0.6; o.pD = -s * 0.6; o.bI = -s * 0.5; o.bD = s * 0.5; o.y = Math.abs(Math.cos(t * 9)) * 0.05;
    } else if (this.pose === 'sentado') {
      o.pI = o.pD = -Math.PI / 2;
      o.y = (this.alturaAsiento || 0.56) - 0.62;
    } else {
      o.y = Math.sin(t * 2) * 0.01;
    }
    switch (this.modo) {
      case 'tipear': o.bI = -1.25 + Math.sin(t * 22) * 0.08; o.bD = -1.25 + Math.sin(t * 22 + 1.5) * 0.08; o.cabX = 0.12 + Math.sin(t * 1.3) * 0.05; break;
      case 'tomar': { const sorbo = (Math.sin(t * 0.9) + 1) / 2; o.bD = -0.6 - sorbo * 1.9; o.bDz = sorbo * 0.25; break; }
      case 'dormir':
        if (acostado) { o.y = 0; o.cabZ = Math.sin(t * 0.4) * 0.15; o.bI = o.bD = 0; }
        else { o.cabZ = 0.35; o.cabX = 0.25; o.bI = o.bD = -0.2; }
        if (t % 3 < dt * 1.5) this.decir('Zzz…', 2);
        break;
      case 'leer': o.bI = o.bD = -1.3; o.bIz = -0.25; o.bDz = 0.25; o.cabX = 0.2; break;
      case 'pensar': o.bD = -2.3; o.bDz = 0.5; o.cabZ = Math.sin(t * 0.8) * 0.1; break;
      case 'gesto': o.bD = -0.8 + Math.sin(t * 5) * 0.4; o.bI = -0.4 + Math.sin(t * 4 + 1) * 0.3; o.cabX = Math.sin(t * 6) * 0.06; break;
      case 'regar': o.bD = o.bI = -1.1; o.cabX = 0.3; break;
      case 'estirar': o.bI = o.bD = -Math.PI * 0.95; o.bIz = -0.2; o.bDz = 0.2; break;
      case 'festejo': o.bI = o.bD = -Math.PI * 0.9 + Math.sin(t * 12) * 0.2; o.y += Math.abs(Math.sin(t * 8)) * 0.08; break;
    }
    const k = Math.min(1, dt * 10), lerp = (a, b) => a + (b - a) * k;
    m.piernaI.rotation.x = lerp(m.piernaI.rotation.x, o.pI);
    m.piernaD.rotation.x = lerp(m.piernaD.rotation.x, o.pD);
    m.brazoI.rotation.x = lerp(m.brazoI.rotation.x, o.bI);
    m.brazoD.rotation.x = lerp(m.brazoD.rotation.x, o.bD);
    m.brazoI.rotation.z = lerp(m.brazoI.rotation.z, o.bIz);
    m.brazoD.rotation.z = lerp(m.brazoD.rotation.z, o.bDz);
    m.cabeza.rotation.x = lerp(m.cabeza.rotation.x, o.cabX);
    m.cabeza.rotation.z = lerp(m.cabeza.rotation.z, o.cabZ);
    m.cuerpo.position.y = lerp(m.cuerpo.position.y, o.y);
    m.diario.visible = this.modo === 'leer';

    // lampara y foco del escritorio
    const prendida = this.trabajando && this.pose === 'sentado' ? 1 : 0;
    this.esc.luz.intensity = lerp(this.esc.luz.intensity, prendida * 2.5);
    this.esc.foco.material.emissiveIntensity = lerp(this.esc.foco.material.emissiveIntensity, prendida * 2);
    this.esc.taza.visible = !m.taza.visible;
  }

  ubicarHtml() {
    const cabeza = new THREE.Vector3();
    this.m.cabeza.getWorldPosition(cabeza);
    const arriba = cabeza.clone().add(new THREE.Vector3(0, 0.45, 0)).project(camera);
    const abajo = new THREE.Vector3(this.pos.x, -0.05, this.pos.y).project(camera);
    const px = v => [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight];
    const [gx, gy] = px(arriba), [ex, ey] = px(abajo);
    this.globo.style.left = gx + 'px'; this.globo.style.top = gy + 'px';
    this.etiqueta.style.left = ex + 'px'; this.etiqueta.style.top = ey + 'px';
    if (reloj.elapsedTime > this.globoHasta) this.globo.classList.remove('visible');
  }
}

const analista = new Agente('analista', modeloAnalista, LUGAR.sillaA, escA, [-1, 2]);
const redactor = new Agente('redactor', modeloRedactor, LUGAR.sillaR, escR, [2, 2.5]);
analista.cama = camaA;
redactor.cama = camaR;
analista.otro = redactor;
redactor.otro = analista;
const agentes = [analista, redactor];

// ---------------------------------------------------------------- monitores
const velas = Array.from({ length: 26 }, (_, i) => 80 + Math.sin(i / 3) * 12);
function dibujarPantallas(t) {
  // analista: velas en vivo o protector de pantalla
  {
    const { ctx: c, cv, tex } = escA.p;
    c.fillStyle = '#0e1117'; c.fillRect(0, 0, cv.width, cv.height);
    if (analista.trabajando && analista.pose === 'sentado') {
      if (Math.random() < 0.35) { velas.shift(); velas.push(velas[velas.length - 1] + (Math.random() - 0.52) * 12); }
      const min = Math.min(...velas) - 8, max = Math.max(...velas) + 8, Y = v => cv.height - 18 - (v - min) / (max - min) * (cv.height - 36);
      c.fillStyle = '#9aa4b2'; c.font = '12px system-ui'; c.fillText('GGAL · 5m · ' + (analista.turno || ''), 8, 14);
      for (let i = 1; i < velas.length; i++) {
        const a = velas[i - 1], b = velas[i], x = 8 + i * 9, sube = b >= a;
        c.fillStyle = sube ? '#089981' : '#f23645';
        c.fillRect(x - 1, Y(Math.max(a, b)) - 4, 2, Math.abs(Y(a) - Y(b)) + 8);
        c.fillRect(x - 3.5, Y(Math.max(a, b)), 7, Math.max(2, Math.abs(Y(a) - Y(b))));
      }
      c.strokeStyle = '#2962ff'; c.lineWidth = 1.5; c.beginPath();
      let e = velas[0];
      velas.forEach((v, i) => { e = v * 0.2 + e * 0.8; const x = 8 + i * 9; i ? c.lineTo(x, Y(e)) : c.moveTo(x, Y(e)); });
      c.stroke();
    } else {
      c.fillStyle = '#2962ff'; c.font = 'bold 22px system-ui';
      c.fillText('GGAL', 90 + Math.sin(t * 0.7) * 70, 85 + Math.sin(t * 1.1) * 45);
    }
    tex.needsUpdate = true;
  }
  // redactor: texto que se va escribiendo
  {
    const { ctx: c, cv, tex } = escR.p;
    c.fillStyle = '#fbfaf6'; c.fillRect(0, 0, cv.width, cv.height);
    if (redactor.trabajando && redactor.pose === 'sentado') {
      c.fillStyle = '#1b1f27'; c.font = 'bold 14px system-ui'; c.fillText('Reporte semanal GGAL', 10, 20);
      const lineas = Math.floor(t * 1.5) % 14;
      for (let i = 0; i < lineas; i++) {
        c.fillStyle = i % 5 === 0 ? '#6b7280' : '#c7cbd3';
        c.fillRect(10, 32 + i * 9, 60 + ((i * 53) % 170), 4);
      }
      if (Math.floor(t * 3) % 2) { c.fillStyle = '#1b1f27'; c.fillRect(12 + ((lineas * 53) % 170), 30 + lineas * 9, 2, 8); }
    } else {
      c.fillStyle = '#e07b39'; c.font = 'bold 20px system-ui';
      c.fillText('✎ semanal', 70 + Math.sin(t * 0.6) * 60, 85 + Math.cos(t * 0.9) * 40);
    }
    tex.needsUpdate = true;
  }
}

// ---------------------------------------------------------------- dia y noche
// ?hora=HH fuerza la hora (para ver la casa de noche o de dia sin esperar).
const horaForzada = new URLSearchParams(location.search).get('hora');
function horaArt() {
  if (horaForzada !== null) { const f = +horaForzada; return { h: Math.floor(f), m: Math.round((f % 1) * 60), f }; }
  const partes = new Intl.DateTimeFormat('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const h = +partes.find(p => p.type === 'hour').value, m = +partes.find(p => p.type === 'minute').value;
  return { h, m, f: h + m / 60 };
}
const esDeNoche = () => { const { f } = horaArt(); return f < 7 || f > 19.5; };
const CIELO = [[0, 0x0b1530], [6, 0x1d2a55], [7.5, 0xf6b88a], [9, 0x9fd3f5], [17.5, 0x9fd3f5], [19, 0xf08a5d], [20, 0x2a2350], [24, 0x0b1530]];
let noche = 0;
function actualizarCielo() {
  const { h, m, f } = horaArt();
  let i = 0;
  while (f > CIELO[i + 1][0]) i++;
  const [f0, c0] = CIELO[i], [f1, c1] = CIELO[i + 1];
  const col = new THREE.Color(c0).lerp(new THREE.Color(c1), (f - f0) / (f1 - f0));
  scene.background = col;
  scene.fog = new THREE.Fog(col, 30, 70);
  vidrio.color.copy(col); vidrio.emissive.copy(col);
  const dia = Math.max(0, Math.min(1, Math.min(f - 6.5, 20 - f) / 1.5));
  sol.intensity = 0.25 + dia * 2.0;
  hemi.intensity = 0.35 + dia * 0.8;
  noche = 1 - dia;
  agHora.rotation.z = -((h % 12) + m / 60) / 12 * Math.PI * 2;
  agMin.rotation.z = -m / 60 * Math.PI * 2;
  document.getElementById('reloj').textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
actualizarCielo();
setInterval(actualizarCielo, 20000);

// ---------------------------------------------------------------- estado real
const sim = { analista: false, redactor: false };
let ultimoEstado = null, conectado = false;
async function consultar() {
  try {
    const r = await fetch('/estado', { cache: 'no-store' });
    ultimoEstado = await r.json();
    conectado = true;
  } catch {
    conectado = false;
  }
  aplicarEstado();
}
function aplicarEstado() {
  const e = (ultimoEstado && ultimoEstado.estado) || {};
  for (const ag of agentes) {
    const real = conectado && e.activo && e.agente === ag.id;
    if (sim[ag.id]) ag.setTrabajo(true, ag.id === 'analista' ? 'apertura' : 'semanal', 'claude');
    else ag.setTrabajo(!!real, real ? e.turno : null, real ? e.paso : null, !real && e.agente === ag.id ? e.resultado : null);
  }
  const con = document.getElementById('conexion');
  con.textContent = conectado ? 'en vivo con los estudios' : 'sin conexión al servidor: modo demo (abrila con abrir_oficina.ps1)';

  const corr = (ultimoEstado && ultimoEstado.corridas) || {};
  const marca = { ok: '✓', error: '✗', murio: '✗', salteado: '–', 'sin cerrar': '…' };
  document.getElementById('corridas').innerHTML = Object.keys(corr).length
    ? Object.entries(corr).map(([t, c]) => `<div><span>${t}</span><span class="r-${c.resultado.split(' ')[0]}">${marca[c.resultado] || ''} ${c.resultado} · ${(c.fin || c.inicio).slice(5, 16)}</span></div>`).join('')
    : '';
}
function actualizarHud() {
  for (const ag of agentes) {
    document.getElementById('p-' + ag.id).classList.toggle('trabajando', ag.trabajando);
    let txt = ag.trabajando ? `trabajando · ${ag.turno || ''}` : ag.actividad;
    const e = ultimoEstado && ultimoEstado.estado;
    if (ag.trabajando && e && e.agente === ag.id && e.desde && !sim[ag.id]) txt += ` (desde ${e.desde.slice(11, 16)})`;
    if (sim[ag.id]) txt += ' (simulado)';
    document.getElementById('q-' + ag.id).textContent = txt;
  }
}
for (const id of ['analista', 'redactor']) {
  const b = document.getElementById('sim-' + id);
  b.onclick = () => { sim[id] = !sim[id]; b.classList.toggle('activo', sim[id]); aplicarEstado(); };
}
// ?avanzar=N adelanta N segundos de simulacion al abrir (para probar sin esperar).
const avanzar = +new URLSearchParams(location.search).get('avanzar') || 0;
consultar().then(() => {
  for (let i = 0, t = 0; i < avanzar * 30; i++, t += 1 / 30) for (const ag of agentes) ag.update(1 / 30, t);
});
setInterval(consultar, 3000);

// ---------------------------------------------------------------- loop
const reloj = new THREE.Clock();
let acumPantalla = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.1), t = reloj.elapsedTime;
  for (const ag of agentes) ag.update(dt, t);
  if ((acumPantalla += dt) > 0.12) { acumPantalla = 0; dibujarPantallas(t); }
  lucesitaCafe.material.emissiveIntensity = 0.6 + Math.sin(t * 3) * 0.4;
  // Luces de la casa: de noche prendidas; si los dos estan en la cama, se apagan (queda el velador).
  const todosDormidos = agentes.every(ag => ag.pose === 'acostado');
  const luz = noche * (todosDormidos ? 0.12 : 1);
  lucesNoche.forEach(l => { l.intensity += (luz * 14 - l.intensity) * 0.05; });
  led.emissiveIntensity = luz * 1.6;
  focosColgantes.forEach(f => { f.material.emissiveIntensity = luz * 2.2; });
  velador.material.emissiveIntensity = noche * (todosDormidos ? 1.2 : 0.8);
  controls.update();
  renderer.render(scene, camera);
  for (const ag of agentes) ag.ubicarHtml();
  actualizarHud();
});
</script>
