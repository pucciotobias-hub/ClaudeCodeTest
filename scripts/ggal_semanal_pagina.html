<title>GGAL Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#15202b; --muted:#5b6875; --line:#d9dfe5;
  --accent:#0b5c8f; --up:#0f8a5f; --down:#c23b32; --flat:#7a8691; --amber:#b77800;
  --up-bg:rgba(15,138,95,.10); --down-bg:rgba(194,59,50,.10); --flat-bg:rgba(122,134,145,.12);
  --violet:#7a4fc2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e141a; --panel:#151d25; --ink:#e4e9ee; --muted:#95a2af; --line:#26313c;
    --accent:#5fb0e6; --up:#3ccf95; --down:#f0736a; --flat:#8d99a5; --amber:#f2b33d;
    --up-bg:rgba(60,207,149,.12); --down-bg:rgba(240,115,106,.12); --flat-bg:rgba(141,153,165,.14);
    --violet:#b79bf0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e141a; --panel:#151d25; --ink:#e4e9ee; --muted:#95a2af; --line:#26313c;
  --accent:#5fb0e6; --up:#3ccf95; --down:#f0736a; --flat:#8d99a5; --amber:#f2b33d;
  --up-bg:rgba(60,207,149,.12); --down-bg:rgba(240,115,106,.12); --flat-bg:rgba(141,153,165,.14);
  --violet:#b79bf0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.55rem;font-weight:600;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
h2 small{font:500 .72rem/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:0;max-width:68ch}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.eyebrow{font:600 .74rem/1 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}

/* Cabecera: el cierre semanal de GGAL es la tesis de la pagina */
header{display:grid;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:22px}
header h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:700}
.tape{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.tape .px{font:600 clamp(2.4rem,8vw,3.6rem)/1 var(--mono);font-variant-numeric:tabular-nums}
.tape .chg{font:600 1.25rem/1 var(--mono)}
.tape .meta{color:var(--muted);font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:.88rem}
.stats b{color:var(--ink);font-family:var(--mono);font-weight:600}

.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tj{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--flat);border-radius:6px;transition:box-shadow .15s,transform .15s}
.tj.negativo{border-top-color:var(--down)} .tj.positivo{border-top-color:var(--up)}
.tj.ancha{grid-column:1 / -1}
.tj:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.tj summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;gap:6px}
.tj summary::-webkit-details-marker{display:none}
.tj .tema{display:flex;justify-content:space-between;gap:8px;font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tj .tema em{font-style:normal;letter-spacing:.06em}
.tj.negativo .tema em,.tj.negativo .dato{color:var(--down)}
.tj.positivo .tema em,.tj.positivo .dato{color:var(--up)}
.tj .dato{font-size:1.7rem;font-weight:600;line-height:1.1}
.tj .tit{font-weight:500;line-height:1.4}
.tj .mas{font-size:.8rem;color:var(--accent);font-weight:500}
.tj[open] .mas{display:none}
.tj p{padding:0 14px 14px;color:var(--muted);font-size:.92rem;max-width:none}
.tj .mini{width:100%;max-width:440px;height:auto;overflow:visible}
.tj.ancha summary{grid-template-columns:minmax(150px,auto) 1fr;column-gap:22px;align-items:center}
.tj.ancha .tema,.tj.ancha .tit,.tj.ancha .mas{grid-column:1 / -1}
@media (max-width:520px){ .tj.ancha summary{grid-template-columns:1fr} }
.resumen{margin:0;padding-left:1.1em;display:grid;gap:6px}
.resumen li{max-width:70ch}

/* Mercados: barras de variacion semanal a escala */
.mk{display:grid;gap:2px}
.mk-row{display:grid;grid-template-columns:minmax(64px,90px) 1fr minmax(70px,auto) 72px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mk-row .tk{font:600 1.05rem/1.1 var(--display);letter-spacing:.02em}
.mk-row .tk span{display:block;font:400 .72rem/1.2 var(--body);color:var(--muted);letter-spacing:0}
.bar{position:relative;height:14px}
.bar::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.mk-row .v{text-align:right;font-weight:600}
.mk-row .c{text-align:right;color:var(--muted);font-size:.85rem}
.mk-note{color:var(--muted);font-size:.85rem;margin-top:8px}

/* Noticias agrupadas por bloque */
.bloques{display:grid;gap:22px}
.bloque h3{font-size:1.15rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.nota{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.chip{font:600 .68rem/1 var(--body);text-transform:uppercase;letter-spacing:.08em;padding:5px 7px;border-radius:3px;align-self:start;margin-top:3px;white-space:nowrap}
.chip.positivo{background:var(--up-bg);color:var(--up)}
.chip.negativo{background:var(--down-bg);color:var(--down)}
.chip.neutro{background:var(--flat-bg);color:var(--flat)}
.nota .t{font-weight:600}
.nota .d{grid-column:2;color:var(--muted);font-size:.92rem}
.nota .src{grid-column:2;font-size:.78rem;color:var(--muted)}
.nota a{color:var(--accent)}
.nota .mag{grid-column:2;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.nota .mag b{color:var(--ink);font-weight:600}
.mag .pts{display:inline-flex;gap:3px}
.mag .pts i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.mag.bajo .pts i:nth-child(-n+1),.mag.medio .pts i:nth-child(-n+2),.mag.alto .pts i{background:var(--amber)}
.nota .porque{grid-column:2;font-size:.88rem}
.nota .porque summary{cursor:pointer;color:var(--accent);font-weight:500;width:max-content}
.nota .porque p{margin-top:4px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;max-width:none}

/* Tecnico */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.niveles{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:12px}
.niveles td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.niveles td:first-child{font:600 .8rem/1.6 var(--mono);width:3.5em}
.niveles td:nth-child(2){font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;width:5.5em}
.niveles tr.R td:first-child{color:var(--down)}
.niveles tr.S td:first-child{color:var(--up)}
.niveles tr.P td{background:rgba(183,120,0,.08)} .niveles tr.P td:first-child{color:var(--amber)}
.niveles tr.precio td{color:var(--accent);font-weight:600;border-top:2px solid var(--accent)}
.table-x{overflow-x:auto}

/* Tecnico en simple: tendencia, regla soporte-precio-resistencia, tres indicadores y el detalle plegado */
.tec{display:grid;gap:16px}
.tend{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.tend .lbl{font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tend b{font:700 1.6rem/1 var(--display);letter-spacing:.02em}
.tend.bajista b{color:var(--down)} .tend.alcista b{color:var(--up)}
.tend span:last-child{color:var(--muted)}
.frase{font-size:1.08rem;font-weight:500}
.regla{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:12px}
.regla-ends{display:flex;justify-content:space-between;gap:12px;font-size:.88rem}
.regla-ends .s{color:var(--up)} .regla-ends .r{color:var(--down);text-align:right}
.regla-ends b{font-size:1.05rem} .regla-ends em{font-style:normal;color:var(--muted);font-size:.8rem}
.regla-bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--up-bg),var(--flat-bg),var(--down-bg));margin:18px 6px 4px}
.regla-bar i{font-style:normal;position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
.regla-bar i span{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:.85rem;font-weight:600;color:var(--accent);white-space:nowrap}
.regla-si{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;font-size:.9rem;color:var(--muted)}
.regla-si b{display:block;color:var(--ink)}
.regla-si .baja{border-left:3px solid var(--down);padding-left:10px}
.regla-si .sube{border-left:3px solid var(--up);padding-left:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.card .k{font:600 .72rem/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card b{font-size:1.5rem;line-height:1.1}
.card .x{font-size:.86rem;color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin:4px 0}
.gauge s{position:absolute;top:0;bottom:0;background:var(--violet);opacity:.18}
.gauge i{position:absolute;top:-4px;width:3px;height:14px;margin-left:-1.5px;background:var(--violet);border-radius:1px}
.det summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
.det[open] summary{margin-bottom:6px}
.rangos{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.rangos button{font:500 .8rem/1 var(--body);color:var(--muted);background:transparent;border:0;padding:6px 10px;cursor:pointer}
.rangos button + button{border-left:1px solid var(--line)}
.rangos button.on{background:var(--accent);color:var(--panel)}

/* Semana que viene */
.agenda{display:grid;gap:0}
.ag{display:grid;grid-template-columns:5.2em 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.ag .dia{font:600 .95rem/1.4 var(--display);letter-spacing:.03em;color:var(--accent)}
.ag .por{display:block;color:var(--muted);font-size:.9rem}
.esc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:6px}
.esc > div{border-top:3px solid var(--flat);padding-top:10px;display:grid;gap:4px;align-content:start}
.esc > div.alcista{border-color:var(--up)} .esc > div.bajista{border-color:var(--down)}
.esc b{font-family:var(--display);font-size:1.15rem;font-weight:600}
.esc .g{font:500 .82rem/1.4 var(--mono);color:var(--muted)}
.panorama{font-size:1.02rem}
.pano{display:grid;gap:18px;margin-top:4px}
.paso{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.paso .nro{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--panel);font:700 1rem/28px var(--display);text-align:center}
.paso h3{font-size:1.2rem;font-weight:600;margin:2px 0 6px}
.facts{display:grid}
.fact{display:grid;grid-template-columns:5.6em 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.fact .chip{text-align:center}
.fact .dato{color:var(--muted);font-size:.85rem}
.fact .ex{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.mirar{margin:0;padding-left:1.1em;display:grid;gap:8px}
.mirar b{color:var(--ink)}
h3.sub{font-size:1.2rem;font-weight:600;margin:22px 0 4px;display:flex;align-items:baseline;gap:10px}
h3.sub small{font:500 .72rem/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.glos{margin-top:18px}
.glos dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:6px 0 0;font-size:.92rem}
.glos dt{font-weight:600} .glos dd{margin:0;color:var(--muted)}

/* Esta semana: los cierres diarios que salieron despues del reporte */
.seg{border-left:3px solid var(--accent);padding-left:16px;display:grid;gap:14px}
.dias{display:grid}
.dia-row{display:grid;grid-template-columns:5.2em auto 1fr;gap:4px 14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.dia-row .f{font:600 .95rem/1.4 var(--display);letter-spacing:.03em;color:var(--accent)}
.dia-row .cx{font:600 1.25rem/1 var(--mono);font-variant-numeric:tabular-nums}
.dia-row .vx{font:600 .95rem/1 var(--mono)}
.dia-row .rg{grid-column:2 / -1;color:var(--muted);font-size:.82rem}
.dia-row .prov{font:500 .68rem/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-left:6px}
.dia-row .nt{grid-column:2 / -1;font-size:.92rem}
.dia-row .mc{grid-column:2 / -1;color:var(--muted);font:400 .8rem/1.4 var(--mono)}
.esc .st{font:600 .68rem/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.seg-fuente{color:var(--muted);font-size:.8rem}


/* Grafico de velas al final: dibujado a escala con los niveles del tecnico */
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline;margin-top:6px}
.readout{font:500 .86rem/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);min-height:1.4em}
.readout .lbl{color:var(--muted)}
.chart{position:relative;margin-top:8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.8rem;margin-top:10px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{display:inline-block;width:18px;height:0;border-top:2px solid currentColor}
.leyenda i.dash{border-top-style:dashed}
.chart-nota{color:var(--muted);font-size:.8rem;margin-top:6px}

footer .fuente{font-style:italic}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
@media (max-width:520px){
  .mk-row{grid-template-columns:64px 1fr 62px;}
  .mk-row .c{display:none}
}
</style>

<div class="wrap" id="app"></div>

<script>
function render(D){
  var app = document.getElementById('app');
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function cls(v){ return v == null ? 'flat' : v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'flat'; }
  function pct(v){ return v == null ? 'N/D' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2).replace('.', ',') + '%'; }
  function px(v, d){ return v == null ? 'N/D' : Number(v).toFixed(d == null ? 2 : d); }
  function tablaNiveles(lista, precio, etiqueta){
    var niv = lista.slice().sort(function(a, b){ return b.nivel - a.nivel; });
    var puesto = false, rows = [];
    var fila = '<tr class="precio"><td>Precio</td><td>' + px(precio) + '</td><td>' + esc(etiqueta) + '</td></tr>';
    niv.forEach(function(n){
      if (!puesto && precio != null && n.nivel < precio) { rows.push(fila); puesto = true; }
      var tipo = /^P/i.test(n.tipo) ? 'P' : /^R/i.test(n.tipo) ? 'R' : 'S';
      rows.push('<tr class="' + tipo + '"><td>' + esc(n.tipo) + '</td><td>' + px(n.nivel) + '</td><td>' + esc(n.que) + '</td></tr>');
    });
    if (!puesto && precio != null) rows.push(fila);
    return '<div class="table-x"><table class="niveles"><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function escenarios(lista){
    return '<div class="esc">' + lista.map(function(e){
      var k = /alc|rebot|sub/i.test(e.sesgo || '') ? 'alcista' : /baj|ca[ií]/i.test(e.sesgo || '') ? 'bajista' : '';
      return '<div class="' + k + '">' + (e.estado ? '<span class="st">' + esc(e.estado) + '</span>' : '') + '<b>' + esc(e.nombre) + '</b><span class="g">' + esc(e.gatillo) + '</span><span>' + esc(e.lectura) + '</span></div>';
    }).join('') + '</div>';
  }
  var h = [];
  var g = D.ggal || {};
  var S = D.seguimiento;
  if (S && !(S.dias && S.dias.length)) S = null;

  h.push('<header><div class="eyebrow">GGAL ADR · semana del ' + esc(D.semana) + '</div>');
  h.push('<h1>' + esc(D.titular || 'Reporte semanal') + '</h1>');
  h.push('<div class="tape"><span class="px">' + px(g.cierre) + '</span><span class="chg ' + cls(g.var_semana) + '">' + pct(g.var_semana) + ' en la semana</span>');
  h.push('<span class="meta">cierre previo ' + px(g.cierre_previo) + '</span></div>');
  h.push('<div class="stats"><span>Rango <b>' + px(g.minimo) + ' – ' + px(g.maximo) + '</b></span><span>EMA20 <b>' + px(g.ema20) + '</b></span><span>RSI14 <b>' + px(g.rsi, 1) + '</b></span>' + (g.volumen_rel ? '<span>Volumen <b>' + esc(g.volumen_rel) + '</b></span>' : '') + '</div></header>');

  // Lo importante en tarjetas (2026-10-21, a pedido de Tobias: "mas dinamica"). Un resumen en texto
  // (semanas viejas) se sigue mostrando como lista.
  if (D.resumen && D.resumen.length) {
    if (typeof D.resumen[0] === 'object') {
      h.push('<section><h2>Lo importante <small>tocá una tarjeta para ver más</small></h2><div class="tarjetas">' + D.resumen.map(function(r){
        var tono = ['positivo','negativo','neutro'].indexOf(r.tono) >= 0 ? r.tono : 'neutro';
        return '<details class="tj ' + tono + (r.grafico ? ' ancha' : '') + '"><summary>' +
          '<span class="tema">' + esc(r.tema) + '<em>' + (tono === 'positivo' ? 'a favor' : tono === 'negativo' ? 'en contra' : 'neutro') + '</em></span>' +
          '<span class="dato num">' + esc(r.dato) + '</span>' +
          (r.grafico === 'semana' ? miniSemana(D) : '') +
          '<span class="tit">' + esc(r.titulo) + '</span><span class="mas">Ver más</span></summary>' +
          '<p>' + esc(r.texto) + '</p></details>';
      }).join('') + '</div></section>');
    } else {
      h.push('<section><h2>Lo importante</h2><ul class="resumen">' + D.resumen.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></section>');
    }
  }

  // Seguimiento: los cierres de los dias que pasaron desde el reporte, sin tocar lo que dice el reporte.
  if (S) {
    h.push('<section class="seg"><h2>Esta semana <small>cierres diarios después del reporte</small></h2>');
    if (S.texto) h.push('<p>' + esc(S.texto) + '</p>');
    h.push('<div class="dias">' + S.dias.map(function(d){
      return '<div class="dia-row"><div class="f">' + esc(fechaCorta(d.fecha)) + '</div>' +
        '<div class="cx">' + px(d.cierre) + (d.provisorio ? '<span class="prov">provisorio</span>' : '') + '</div>' +
        '<div class="vx ' + cls(d.var) + '">' + pct(d.var) + '</div>' +
        '<div class="rg num">A ' + px(d.apertura) + ' · M ' + px(d.maximo) + ' · m ' + px(d.minimo) + '</div>' +
        (d.nota ? '<div class="nt">' + esc(d.nota) + '</div>' : '') +
        (d.macro ? '<div class="mc">' + esc(d.macro) + '</div>' : '') + '</div>';
    }).join('') + '</div>');
    if (S.escenarios && S.escenarios.length) h.push(escenarios(S.escenarios));
    if (S.fuente) h.push('<p class="seg-fuente">' + esc(S.fuente) + '</p>');
    h.push('</section>');
  }

  if (D.mercados && D.mercados.length) {
    var max = Math.max.apply(null, D.mercados.map(function(m){ return Math.abs(m.var || 0); }).concat([1]));
    h.push('<section><h2>La semana en números <small>variación semanal · feed de TradingView</small></h2><div class="mk">');
    D.mercados.forEach(function(m){
      var w = Math.abs(m.var || 0) / max * 50;
      var left = (m.var || 0) >= 0 ? 50 : 50 - w;
      var col = (m.var || 0) >= 0 ? 'var(--up)' : 'var(--down)';
      h.push('<div class="mk-row"><div class="tk">' + esc(m.ticker) + '<span>' + esc(m.nombre) + '</span></div>' +
        '<div class="bar" aria-hidden="true"><i style="left:' + left + '%;width:' + w + '%;background:' + col + '"></i></div>' +
        '<div class="v num ' + cls(m.var) + '">' + pct(m.var) + '</div><div class="c num">' + esc(m.cierre == null ? 'N/D' : m.cierre) + '</div></div>');
    });
    h.push('</div>' + (D.mercados_nota ? '<p class="mk-note">' + esc(D.mercados_nota) + '</p>' : '') + '</section>');
  }

  if (D.noticias && D.noticias.length) {
    var orden = [], grupos = {};
    D.noticias.forEach(function(n){ var b = n.bloque || 'Otros'; if (!grupos[b]) { grupos[b] = []; orden.push(b); } grupos[b].push(n); });
    h.push('<section><h2>Noticias macro <small>qué movió y por qué importa para GGAL</small></h2><div class="bloques">');
    orden.forEach(function(b){
      h.push('<div class="bloque"><h3>' + esc(b) + '</h3>');
      grupos[b].forEach(function(n){
        var imp = ['positivo','negativo','neutro'].indexOf(n.impacto) >= 0 ? n.impacto : 'neutro';
        // Magnitud del impacto en Argentina y explicacion desplegable (2026-10-21, a pedido de Tobias).
        var mag = ['alto','medio','bajo'].indexOf(n.magnitud) >= 0 ? n.magnitud : null;
        h.push('<div class="nota"><span class="chip ' + imp + '">' + imp + '</span><div class="t">' + esc(n.titulo) + '</div>' +
          (mag ? '<div class="mag ' + mag + '"><span class="pts"><i></i><i></i><i></i></span>Impacto en Argentina: <b>' + mag + '</b></div>' : '') +
          '<div class="d">' + esc(n.detalle) + '</div>' +
          (n.explicacion ? '<details class="porque"><summary>¿Por qué importa?</summary><p>' + esc(n.explicacion) + '</p></details>' : '') +
          (n.fuente ? '<div class="src">' + (n.url ? '<a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.fuente) + '</a>' : esc(n.fuente)) + (n.fecha ? ' · ' + esc(n.fecha) : '') + '</div>' : '') + '</div>');
      });
      h.push('</div>');
    });
    h.push('</div></section>');
  }

  // Tecnico en simple (2026-10-21, a pedido de Tobias: el parrafo largo y la tabla no se entendian).
  // Arriba lo que hay que saber; el texto y la tabla completa quedan en "Ver el detalle".
  var t = D.tecnico || {};
  var K = claves(D);
  if (K.precio != null && (K.techo || K.piso)) {
    var all = serie(D), I = calc(all), u = all.length - 1;
    var T = K.T, tend = (T.tendencia || '').toLowerCase();
    h.push('<section><h2>Técnico <small>dónde está y qué mirar</small></h2><div class="tec">');
    if (tend) h.push('<div class="tend ' + (/baj/.test(tend) ? 'bajista' : /alc/.test(tend) ? 'alcista' : '') + '"><span class="lbl">Tendencia</span><b>' + esc(tend.charAt(0).toUpperCase() + tend.slice(1)) + '</b>' + (T.tendencia_texto ? '<span>' + esc(T.tendencia_texto) + '</span>' : '') + '</div>');
    if (T.frase) h.push('<p class="frase">' + esc(T.frase) + '</p>');
    if (K.techo && K.piso) {
      var pos = Math.max(0, Math.min(1, (K.precio - K.piso.nivel) / (K.techo.nivel - K.piso.nivel)));
      function dist(n){ return pct((n / K.precio - 1) * 100); }
      h.push('<div class="regla"><div class="regla-ends"><span class="s">Soporte <b class="num">' + px(K.piso.nivel) + '</b> <em>' + dist(K.piso.nivel) + '</em></span><span class="r">Resistencia <b class="num">' + px(K.techo.nivel) + '</b> <em>' + dist(K.techo.nivel) + '</em></span></div>' +
        '<div class="regla-bar"><i style="left:' + (pos * 100).toFixed(1) + '%"><span class="num">' + px(K.precio) + '</span></i></div>' +
        '<div class="regla-si"><div class="baja"><b>Si cierra debajo de ' + px(K.piso.nivel) + '</b>' + esc(K.piso.si || '') + '</div><div class="sube"><b>Si cierra arriba de ' + px(K.techo.nivel) + '</b>' + esc(K.techo.si || '') + '</div></div></div>');
    }
    var rsi = I.rsi[u], ema = I.ema[u], va = I.volAvg[u], vol = all[u][5];
    var cards = [];
    if (rsi != null) cards.push('<div class="card"><span class="k">Fuerza · RSI 14</span><b class="num">' + rsi.toFixed(0) + '</b>' +
      '<div class="gauge"><s style="left:30%;width:40%"></s><i style="left:' + rsi.toFixed(1) + '%"></i></div><span class="x">' + leerRSI(rsi) + '</span></div>');
    if (ema != null) { var de = (all[u][4] / ema - 1) * 100;
      cards.push('<div class="card"><span class="k">Promedio de 20 días</span><b class="num">' + ema.toFixed(2) + '</b><span class="x">El precio está ' + pct(de).replace(/^[+−]/, '') + (de < 0 ? ' debajo: la tendencia de corto plazo sigue para abajo.' : ' arriba: la tendencia de corto plazo es para arriba.') + '</span></div>'); }
    if (vol && va) { var vr = vol / va * 100;
      cards.push('<div class="card"><span class="k">Volumen del último día</span><b class="num">' + fmtVol(vol) + '</b><span class="x">' + vr.toFixed(0) + '% del promedio de 20 días: ' + (vr >= 120 ? 'más movimiento que lo normal.' : vr <= 80 ? 'poco movimiento.' : 'normal.') + '</span></div>'); }
    if (cards.length) h.push('<div class="cards">' + cards.join('') + '</div>');
    if (t.texto || K.lista.length) {
      h.push('<details class="det"><summary>Ver el detalle técnico</summary>');
      if (K.lista.length) h.push(tablaNiveles(K.lista, K.precio, S ? (S.precio_nota || 'último cierre') : 'cierre de la semana'));
      if (t.texto) h.push('<p style="margin-top:12px"><b>La semana del reporte.</b> ' + esc(t.texto) + '</p>');
      h.push('</details>');
    }
    h.push('</div></section>');
  } else if (t.texto || (t.niveles && t.niveles.length)) {
    h.push('<section><h2>Técnico</h2><div class="panel"><p>' + esc(t.texto) + '</p>' + (t.niveles && t.niveles.length ? tablaNiveles(t.niveles, g.cierre, 'cierre de la semana') : '') + '</div></section>');
  }

  if ((D.agenda && D.agenda.length) || (D.escenarios && D.escenarios.length) || D.panorama) {
    h.push('<section><h2>Panorama <small>la semana que viene</small></h2>');
    // Panorama didactico (2026-10-21, a pedido de Tobias): en tres pasos en vez de un parrafo.
    // Un panorama en texto (semanas viejas) se sigue mostrando como parrafo.
    var P = D.panorama;
    if (P && typeof P === 'object') {
      h.push('<div class="pano">');
      if (P.donde) h.push('<div class="paso"><span class="nro">1</span><div><h3>Dónde está</h3><p>' + esc(P.donde) + '</p></div></div>');
      if (P.factores && P.factores.length) h.push('<div class="paso"><span class="nro">2</span><div><h3>Qué la viene moviendo</h3><div class="facts">' + P.factores.map(function(f){
        var imp = ['positivo','negativo','neutro'].indexOf(f.efecto) >= 0 ? f.efecto : 'neutro';
        var flecha = imp === 'positivo' ? 'a favor' : imp === 'negativo' ? 'en contra' : 'neutro';
        return '<div class="fact"><span class="chip ' + imp + '">' + flecha + '</span><div><b>' + esc(f.factor) + '</b>' + (f.dato ? ' <span class="dato num">' + esc(f.dato) + '</span>' : '') + '<span class="ex">' + esc(f.explica) + '</span></div></div>';
      }).join('') + '</div></div></div>');
      if (P.mirar && P.mirar.length) h.push('<div class="paso"><span class="nro">3</span><div><h3>Qué mirar esta semana</h3><ul class="mirar">' + P.mirar.map(function(m){
        return '<li><b>' + esc(m.que) + '</b> ' + esc(m.por_que) + '</li>';
      }).join('') + '</ul></div></div>');
      h.push('</div>');
    } else if (P) h.push('<p class="panorama">' + esc(P) + '</p>');
    if (D.agenda && D.agenda.length) {
      h.push('<h3 class="sub">Calendario</h3><div class="agenda">' + D.agenda.map(function(a){ return '<div class="ag"><div class="dia">' + esc(a.dia) + '</div><div>' + esc(a.evento) + '<span class="por">' + esc(a.por_que) + '</span></div></div>'; }).join('') + '</div>');
    }
    if (D.escenarios && D.escenarios.length) h.push('<h3 class="sub">Escenarios <small>según cómo cierre</small></h3>' + escenarios(D.escenarios));
    if (P && P.glosario && P.glosario.length) h.push('<details class="det glos"><summary>Palabras que aparecen en el reporte</summary><dl>' + P.glosario.map(function(gl){ return '<dt>' + esc(gl.termino) + '</dt><dd>' + esc(gl.que) + '</dd>'; }).join('') + '</dl></details>');
    h.push('</section>');
  }

  if (D.velas && D.velas.length > 5) {
    h.push('<section><h2>Gráfico <small>precio, volumen y RSI · diario</small></h2>' +
      '<div class="chart-head"><div class="readout" id="readout"></div>' +
      '<div class="rangos" id="rangos"><button data-r="22">1 mes</button><button data-r="66">3 meses</button><button data-r="999">Todo</button></div></div>' +
      '<div class="chart" id="chart" role="img" aria-label="Gráfico diario de GGAL: velas, volumen y RSI, con el soporte y la resistencia del técnico"></div>' +
      '<div class="leyenda"><span style="color:var(--accent)"><i></i>Promedio de 20 días</span><span style="color:var(--up)"><i class="dash"></i>Soporte</span><span style="color:var(--down)"><i class="dash"></i>Resistencia</span><span style="color:var(--violet)"><i></i>Divergencia</span></div>' +
      '<p class="chart-nota">Barras del pie: volumen (las más marcadas superaron el promedio de 20 días). Panel de abajo: RSI, debajo de 30 es sobreventa. Pasá el dedo o el mouse por las velas para ver cada día.</p></section>');
  }

  h.push('<footer><span>Generado ' + esc(D.generado) + ' · precios del feed de TradingView, noticias de la web con fuente citada.</span>' +
    (D.notas ? '<span>' + esc(D.notas) + '</span>' : '') +
    '<span>Descripción del cuadro técnico y macro. No es asesoramiento financiero.</span></footer>');

  app.innerHTML = h.join('');
}

var DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(s){ var p = s.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]); return DIAS[d.getDay()] + ' ' + (+p[2]) + '-' + MESES[+p[1]-1]; }

// Mini grafico de la tarjeta "La semana": los cinco cierres del reporte contra el viernes anterior.
function miniSemana(D){
  var v = (D.velas || []).slice(-5), base = (D.ggal || {}).cierre_previo;
  if (v.length < 2) return '';
  var W = 320, H = 92, pl = 8, pr = 8, pt = 18, pb = 18;
  var vals = v.map(function(r){ return r[4]; }).concat(base != null ? [base] : []);
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), sp = (hi - lo) || 1;
  function X(i){ return pl + (W - pl - pr) * i / (v.length - 1); }
  function Y(c){ return pt + (hi - c) / sp * (H - pt - pb); }
  var col = base != null && v[v.length-1][4] < base ? 'var(--down)' : 'var(--up)';
  var s = [];
  if (base != null) {
    s.push('<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(base).toFixed(1)+'" y2="'+Y(base).toFixed(1)+'" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>');
    s.push('<text x="'+(W-pr)+'" y="'+(Y(base)-4).toFixed(1)+'" font-size="9.5" fill="var(--muted)" text-anchor="end">viernes anterior '+base.toFixed(2)+'</text>');
  }
  s.push('<polyline fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" points="'+v.map(function(r, i){ return X(i).toFixed(1)+','+Y(r[4]).toFixed(1); }).join(' ')+'"/>');
  v.forEach(function(r, i){
    var d = DIAS[new Date(+r[0].slice(0,4), +r[0].slice(5,7)-1, +r[0].slice(8,10)).getDay()];
    s.push('<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(r[4]).toFixed(1)+'" r="3.2" fill="var(--panel)" stroke="'+col+'" stroke-width="1.8"><title>'+d+' '+r[4].toFixed(2)+'</title></circle>');
    s.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-3)+'" font-size="10" fill="var(--muted)" text-anchor="'+(i === 0 ? 'start' : i === v.length-1 ? 'end' : 'middle')+'">'+d+' '+r[4].toFixed(2)+'</text>');
  });
  return '<svg class="mini" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+s.join('')+'</svg>';
}

// Velas de la semana del reporte mas las del seguimiento (las que ya estan, no se repiten).
// Cada fila: [fecha, apertura, maximo, minimo, cierre, volumen]; el volumen puede faltar en semanas viejas.
function serie(D){
  var v = (D.velas || []).slice();
  if (!v.length) return v;
  var seg = D.seguimiento && D.seguimiento.dias ? D.seguimiento.dias : [];
  var ultima = v[v.length - 1][0];
  seg.forEach(function(d){
    if (d.fecha > ultima && d.cierre != null) v.push([d.fecha, d.apertura, d.maximo, d.minimo, d.cierre, d.volumen == null ? null : d.volumen]);
  });
  return v;
}

// Promedio de 20 dias (EMA), RSI14 de Wilder y promedio de volumen de las 20 ruedas anteriores.
function calc(all){
  var k = 2/21, ema = [], e = null, rsi = [], g = 0, l = 0, volAvg = [];
  all.forEach(function(r, i){
    e = i ? r[4]*k + e*(1-k) : r[4]; ema.push(e);
    if (i === 0) { rsi.push(null); }
    else {
      var d = r[4] - all[i-1][4], up = Math.max(d, 0), dn = Math.max(-d, 0);
      if (i <= 14) { g += up / 14; l += dn / 14; rsi.push(i === 14 ? (l ? 100 - 100/(1 + g/l) : 100) : null); }
      else { g = (g*13 + up)/14; l = (l*13 + dn)/14; rsi.push(l ? 100 - 100/(1 + g/l) : 100); }
    }
    if (i >= 20 && r[5] != null) {
      var s = 0, ok = true;
      for (var j = i - 20; j < i; j++) { if (all[j][5] == null) { ok = false; break; } s += all[j][5]; }
      volAvg.push(ok ? s / 20 : null);
    } else volAvg.push(null);
  });
  return {ema: ema, rsi: rsi, volAvg: volAvg};
}

// El cuadro de ahora: con seguimiento manda el ultimo cierre y su mapa; sin el, el de la semana.
// Soporte y resistencia son los niveles mas cercanos al precio, salvo que el JSON los nombre.
function claves(D){
  var t = D.tecnico || {}, S = D.seguimiento && D.seguimiento.dias && D.seguimiento.dias.length ? D.seguimiento : null;
  var T = {}, a;
  for (a in t) T[a] = t[a];
  if (S && S.tecnico) for (a in S.tecnico) T[a] = S.tecnico[a];
  var lista = ((S && S.niveles && S.niveles.length) ? S.niveles : (t.niveles || [])).slice();
  var precio = S ? (S.precio != null ? S.precio : S.dias[S.dias.length - 1].cierre) : (D.ggal || {}).cierre;
  var techo = T.techo, piso = T.piso;
  if (precio != null) {
    if (!techo) lista.forEach(function(n){ if (n.nivel > precio && (!techo || n.nivel < techo.nivel)) techo = {nivel: n.nivel}; });
    if (!piso) lista.forEach(function(n){ if (n.nivel < precio && (!piso || n.nivel > piso.nivel)) piso = {nivel: n.nivel}; });
  }
  return {T: T, lista: lista, precio: precio, techo: techo, piso: piso};
}

function leerRSI(v){
  return v < 30 ? 'Sobreventa: cayó mucho y rápido, suele haber rebotes.' :
    v < 45 ? 'Débil, cerca de la sobreventa (30).' :
    v <= 55 ? 'Neutral.' : v <= 70 ? 'Firme.' : 'Sobrecompra: subió mucho y rápido.';
}
function fmtVol(v){ return v == null ? 'N/D' : v >= 1e6 ? (v/1e6).toFixed(2).replace('.', ',') + ' M' : Math.round(v/1000) + ' mil'; }
function cls(v){ return v == null ? 'flat' : v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'flat'; }
function pct(v){ return v == null ? 'N/D' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2).replace('.', ',') + '%'; }

// Grafico (rediseño del 2026-10-21, a pedido de Tobias: "no se entiende nada, menos resistencias, mas volumen").
// Tres cosas y nada mas: velas con el volumen al pie, una linea de soporte y una de resistencia con su
// nombre, y el RSI abajo con la divergencia del estudio dibujada si la hay.
var RANGO = null;
function drawChart(D){
  var box = document.getElementById('chart');
  if (!box || !D.velas) return;
  var all = serie(D), I = calc(all), K = claves(D);
  var W = Math.max(260, box.clientWidth || 800);
  var narrow = W < 560;
  var rango = RANGO || (narrow ? 22 : 66);   // hasta que se elige un boton, depende del ancho
  var botones = document.querySelectorAll('#rangos button');
  for (var b = 0; b < botones.length; b++) botones[b].className = +botones[b].getAttribute('data-r') === rango ? 'on' : '';
  var n = Math.min(all.length - 20, rango);
  var start = all.length - n;
  var bars = all.slice(start), emaS = I.ema.slice(start), rsiS = I.rsi.slice(start), vaS = I.volAvg.slice(start);
  var padL = 4, padR = narrow ? 58 : 66, padT = 10;
  var Hp = narrow ? 230 : 300, gap = 16, Hr = narrow ? 70 : 84, axis = 22;
  var H = padT + Hp + gap + Hr + axis;
  var pw = W - padL - padR;
  var step = pw / n, cw = Math.max(2, Math.min(10, step*0.6));
  function X(i){ return padL + step*(i + 0.5); }

  // escala del precio: velas y promedio; las dos lineas solo si quedan cerca
  var lo = Infinity, hi = -Infinity;
  bars.forEach(function(r, i){ lo = Math.min(lo, r[3], emaS[i]); hi = Math.max(hi, r[2], emaS[i]); });
  var lineas = [];
  if (K.techo) lineas.push({nivel: K.techo.nivel, txt: 'Resistencia', col: 'var(--down)', arriba: true});
  if (K.piso) lineas.push({nivel: K.piso.nivel, txt: 'Soporte', col: 'var(--up)', arriba: false});
  var span0 = hi - lo;
  lineas = lineas.filter(function(l){ return l.nivel > lo - span0*0.3 && l.nivel < hi + span0*0.3; });
  lineas.forEach(function(l){ lo = Math.min(lo, l.nivel); hi = Math.max(hi, l.nivel); });
  var span = hi - lo;
  // el volumen ocupa el 22% de abajo del panel de precio: se deja ese lugar libre debajo de las velas
  lo -= span*0.30; hi += span*0.05;
  function Y(v){ return padT + (hi - v) / (hi - lo) * Hp; }
  var yR0 = padT + Hp + gap;
  function YR(v){ return yR0 + (100 - v) / 100 * Hr; }
  var s = [];

  // grilla con precios a la derecha
  var pasos = [0.5, 1, 2, 5, 10], gs = pasos[0];
  for (var p = 0; p < pasos.length; p++) { gs = pasos[p]; if ((hi - lo) / gs <= (narrow ? 6 : 8)) break; }
  for (var gv = Math.ceil(lo/gs)*gs; gv <= hi; gv += gs) {
    var yg = Y(gv);
    if (yg > padT + Hp*0.78) continue;
    s.push('<line x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+yg.toFixed(1)+'" y2="'+yg.toFixed(1)+'" stroke="var(--line)" stroke-width="1" opacity=".6"/>');
    s.push('<text x="'+(padL+pw+6)+'" y="'+(yg+4).toFixed(1)+'" font-size="10.5" fill="var(--muted)">'+gv.toFixed(gs < 1 ? 1 : 0)+'</text>');
  }

  // volumen al pie del panel de precio
  var vmax = 0;
  bars.forEach(function(r){ if (r[5] != null) vmax = Math.max(vmax, r[5]); });
  if (vmax) {
    var vb = padT + Hp, vh = Hp*0.2;
    bars.forEach(function(r, i){
      if (r[5] == null) return;
      var h = r[5] / vmax * vh, fuerte = vaS[i] != null && r[5] > vaS[i];
      s.push('<rect x="'+(X(i)-cw/2).toFixed(1)+'" y="'+(vb-h).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(r[4] >= r[1] ? 'var(--up)' : 'var(--down)')+'" opacity="'+(fuerte ? '.55' : '.2')+'"/>');
    });
    var pts = [];
    bars.forEach(function(r, i){ if (vaS[i] != null) pts.push(X(i).toFixed(1)+','+(vb - vaS[i]/vmax*vh).toFixed(1)); });
    if (pts.length > 1) s.push('<polyline fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" points="'+pts.join(' ')+'"/>');
    s.push('<text x="'+(padL+pw+6)+'" y="'+(vb-vh+8).toFixed(1)+'" font-size="10" fill="var(--muted)">Vol</text>');
  }

  // promedio de 20 dias
  s.push('<polyline fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" opacity=".85" points="' + emaS.map(function(v, i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ') + '"/>');

  // soporte y resistencia, con su nombre en palabras
  lineas.forEach(function(l){
    var y = Y(l.nivel);
    s.push('<line x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+l.col+'" stroke-width="1.4" stroke-dasharray="6 4"/>');
    s.push('<text x="'+(padL+4)+'" y="'+(l.arriba ? y-5 : y+13).toFixed(1)+'" font-size="11" font-weight="600" fill="'+l.col+'" letter-spacing=".04em" stroke="var(--bg)" stroke-width="4" paint-order="stroke" stroke-linejoin="round">'+l.txt.toUpperCase()+' '+l.nivel.toFixed(2)+'</text>');
  });

  // velas
  bars.forEach(function(r, i){
    var up = r[4] >= r[1], col = up ? 'var(--up)' : 'var(--down)';
    var x = X(i), yo = Y(r[1]), yc = Y(r[4]);
    s.push('<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+Y(r[2]).toFixed(1)+'" y2="'+Y(r[3]).toFixed(1)+'" stroke="'+col+'" stroke-width="1.1"/>');
    s.push('<rect x="'+(x-cw/2).toFixed(1)+'" y="'+Math.min(yo,yc).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+Math.max(1, Math.abs(yc-yo)).toFixed(1)+'" fill="'+col+'"/>');
  });

  // precio actual a la derecha
  var last = bars[n-1], yl = Y(last[4]);
  s.push('<line x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+yl.toFixed(1)+'" y2="'+yl.toFixed(1)+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="1 3"/>');
  s.push('<rect x="'+(padL+pw+2)+'" y="'+(yl-9).toFixed(1)+'" width="'+(padR-4)+'" height="18" rx="3" fill="var(--accent)"/>');
  s.push('<text x="'+(padL+pw+7)+'" y="'+(yl+4).toFixed(1)+'" font-size="11.5" font-weight="600" fill="var(--panel)">'+last[4].toFixed(2)+'</text>');

  // panel del RSI: franja 30-70, linea y valor actual
  s.push('<rect x="'+padL+'" y="'+YR(70).toFixed(1)+'" width="'+pw+'" height="'+(YR(30)-YR(70)).toFixed(1)+'" fill="var(--violet)" opacity=".07"/>');
  [30, 70].forEach(function(v){
    s.push('<line x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+YR(v).toFixed(1)+'" y2="'+YR(v).toFixed(1)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>');
    s.push('<text x="'+(padL+pw+6)+'" y="'+(YR(v)+4).toFixed(1)+'" font-size="10" fill="var(--muted)">'+v+'</text>');
  });
  s.push('<line x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+(yR0+Hr).toFixed(1)+'" y2="'+(yR0+Hr).toFixed(1)+'" stroke="var(--line)"/>');
  s.push('<text x="'+(padL+4)+'" y="'+(yR0+10)+'" font-size="10.5" fill="var(--muted)">RSI 14</text>');
  var rp = [];
  rsiS.forEach(function(v, i){ if (v != null) rp.push(X(i).toFixed(1)+','+YR(v).toFixed(1)); });
  s.push('<polyline fill="none" stroke="var(--ink)" stroke-width="1.3" opacity=".75" points="'+rp.join(' ')+'"/>');
  var rl = rsiS[n-1];
  if (rl != null) {
    s.push('<rect x="'+(padL+pw+2)+'" y="'+(YR(rl)-8).toFixed(1)+'" width="'+(padR-4)+'" height="16" rx="3" fill="var(--violet)"/>');
    s.push('<text x="'+(padL+pw+7)+'" y="'+(YR(rl)+4).toFixed(1)+'" font-size="11" font-weight="600" fill="var(--panel)">'+rl.toFixed(1)+'</text>');
  }

  // divergencia del estudio: minimos del precio y RSI en las mismas dos fechas
  var dv = K.T.divergencia;
  if (dv && dv.desde && dv.hasta) {
    var ia = -1, ib = -1;
    bars.forEach(function(r, i){ if (r[0] === dv.desde) ia = i; if (r[0] === dv.hasta) ib = i; });
    if (ia >= 0 && ib > ia && rsiS[ia] != null && rsiS[ib] != null) {
      s.push('<line x1="'+X(ia).toFixed(1)+'" x2="'+X(ib).toFixed(1)+'" y1="'+(Y(bars[ia][3])+5).toFixed(1)+'" y2="'+(Y(bars[ib][3])+5).toFixed(1)+'" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round"/>');
      s.push('<line x1="'+X(ia).toFixed(1)+'" x2="'+X(ib).toFixed(1)+'" y1="'+YR(rsiS[ia]).toFixed(1)+'" y2="'+YR(rsiS[ib]).toFixed(1)+'" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round"/>');
      var tx = Math.min(X(ib), padL + pw - (narrow ? 70 : 80));
      s.push('<text x="'+tx.toFixed(1)+'" y="'+(Math.max(YR(rsiS[ia]), YR(rsiS[ib])) + 14).toFixed(1)+'" font-size="10.5" font-weight="600" fill="var(--violet)" text-anchor="end" stroke="var(--bg)" stroke-width="4" paint-order="stroke">DIVERGENCIA '+(dv.tipo ? dv.tipo.toUpperCase() : '')+'</text>');
    }
  }

  // eje de fechas: el primer dia de cada mes
  var prevM = null;
  bars.forEach(function(r, i){
    var m = r[0].slice(5,7);
    if (m !== prevM && prevM !== null) {
      s.push('<line x1="'+X(i).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y1="'+(yR0+Hr)+'" y2="'+(yR0+Hr+4)+'" stroke="var(--muted)"/>');
      s.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" font-size="11" fill="var(--muted)" text-anchor="middle">'+MESES[+m-1]+'</text>');
    }
    prevM = m;
  });

  // cursor
  s.push('<line id="cx" x1="0" x2="0" y1="'+padT+'" y2="'+(yR0+Hr)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" visibility="hidden"/>');
  box.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">' + s.join('') + '</svg>';

  var ro = document.getElementById('readout'), cx = box.querySelector('#cx'), svg = box.querySelector('svg');
  function show(i){
    var r = bars[i], prev = start + i > 0 ? all[start+i-1][4] : null;
    var ch = prev ? (r[4]/prev - 1)*100 : null;
    ro.innerHTML = '<span class="lbl">' + fechaCorta(r[0]) + '</span> · Cierre <b>' + r[4].toFixed(2) + '</b>' +
      (ch == null ? '' : ' <span class="' + cls(ch) + '">' + pct(ch) + '</span>') +
      (r[5] != null ? ' <span class="lbl">· Vol</span> ' + fmtVol(r[5]) + (vaS[i] ? ' <span class="lbl">(' + (r[5]/vaS[i]*100).toFixed(0) + '% del prom.)</span>' : '') : '') +
      (rsiS[i] != null ? ' <span class="lbl">· RSI</span> ' + rsiS[i].toFixed(1) : '');
  }
  function move(ev){
    var rect = svg.getBoundingClientRect();
    var x = (ev.clientX - rect.left) * W / rect.width;
    var i = Math.max(0, Math.min(n-1, Math.floor((x - padL) / step)));
    cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.setAttribute('visibility', 'visible');
    show(i);
  }
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', function(){ cx.setAttribute('visibility', 'hidden'); show(n-1); });
  show(n-1);
}

var DATOS = JSON.parse(document.getElementById('datos').textContent);
render(DATOS);
drawChart(DATOS);
var rg = document.getElementById('rangos');
if (rg) rg.addEventListener('click', function(ev){ var r = ev.target.getAttribute && ev.target.getAttribute('data-r'); if (r) { RANGO = +r; drawChart(DATOS); } });
// Se redibuja cuando cambia el ancho del grafico (no solo de la ventana): si se dibujo con el panel angosto,
// el SVG quedaba estirado con las letras enormes.
var _rw = 0;
function redibujar(){ var b = document.getElementById('chart'); if (b && b.clientWidth && b.clientWidth !== _rw) { _rw = b.clientWidth; drawChart(DATOS); } }
if (window.ResizeObserver && document.getElementById('chart')) new ResizeObserver(redibujar).observe(document.getElementById('chart'));
window.addEventListener('resize', redibujar);
</script>
